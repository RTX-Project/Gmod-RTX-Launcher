name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bump Build Number
      run: |
        python -c "import re; c=open('rtx-launcher/LauncherUpdater.h', 'r', encoding='utf-8').read(); open('rtx-launcher/LauncherUpdater.h', 'w', encoding='utf-8').write(re.sub(r'(CURRENT_BUILD_NUMBER = )(\d+)', lambda m: m.group(1)+str(int(m.group(2))+1), c))"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rtx-launcher/LauncherUpdater.h
        git commit -m "Bump build number [skip ci]" || echo "No changes"
        for ($i=0; $i -lt 5; $i++) {
            git pull --rebase origin main
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
        }

    - name: Build Solution
      run: |
        msbuild rtx-launcher\rtx-launcher.vcxproj /p:Configuration=Release /p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild rtx-installer\rtx-installer.vcxproj /p:Configuration=Release /p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
    - name: Debug Output Dir
      run: |
        dir rtx-launcher\x64\Release\
        dir rtx-installer\x64\Release\

    - name: Extract Version
      id: extract_version
      run: |
        $versionLine = Get-Content rtx-launcher\LauncherUpdater.h | Select-String 'CURRENT_VERSION ='
        $version = $versionLine -replace '.*L"([^"]+)".*', '$1'
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && '0.0.2' || github.ref_name }}
        name: v${{ env.VERSION }} Release
        files: |
          rtx-installer/x64/Release/rtx-installer.exe
          rtx-launcher/x64/Release/system_data.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
