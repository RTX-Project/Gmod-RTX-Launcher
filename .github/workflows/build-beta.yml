name: Beta Build (No Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-beta:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Bump Build Number
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git checkout main
        for ($i=0; $i -lt 5; $i++) {
            git pull origin main
            python -c "import re; c=open('rtx-launcher/LauncherUpdater.h', 'r', encoding='utf-8').read(); open('rtx-launcher/LauncherUpdater.h', 'w', encoding='utf-8').write(re.sub(r'(CURRENT_BUILD_NUMBER = )(\d+)', lambda m: m.group(1)+str(int(m.group(2))+1), c))"
            git add rtx-launcher/LauncherUpdater.h
            git commit -m "Bump build number [skip ci]" || echo "No changes"
            git push origin main
            if ($LASTEXITCODE -eq 0) { break }
            git reset --hard HEAD~1
            Start-Sleep -Seconds 2
        }

    - name: Build Solution
      run: |
        msbuild rtx-launcher\rtx-launcher.vcxproj /p:Configuration=Release /p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild rtx-installer\rtx-installer.vcxproj /p:Configuration=Release /p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        
    - name: Debug Output Dir
      run: |
        dir rtx-launcher\x64\Release\

    - name: Extract Build Number and Version
      id: extract_build
      run: |
        $buildLine = Get-Content rtx-launcher\LauncherUpdater.h | Select-String 'CURRENT_BUILD_NUMBER ='
        $build = $buildLine -replace '.*=\s*(\d+).*', '$1'
        echo "BUILD_NUM=$build" | Out-File -FilePath $env:GITHUB_ENV -Append
        $versionLine = Get-Content rtx-launcher\LauncherUpdater.h | Select-String 'CURRENT_VERSION ='
        $version = $versionLine -replace '.*L"([^"]+)".*', '$1'
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Generate Changelog
      run: |
        echo "Изменения в этой бета-версии:" > changelog.txt
        git log -5 --pretty=format:"- %s" >> changelog.txt
        
    - name: Release to Beta Channel
      uses: softprops/action-gh-release@v2
      with:
        tag_name: beta-latest
        name: v${{ env.VERSION }}-Beta (Build ${{ env.BUILD_NUM }})
        prerelease: true
        body_path: changelog.txt
        files: |
          rtx-installer/x64/Release/rtx-installer.exe
          rtx-launcher/x64/Release/system_data.bin
